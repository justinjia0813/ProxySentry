name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run tests
        run: >-
          xcodebuild test
          -project ProxySentry.xcodeproj
          -scheme ProxySentry
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned universal package
        run: ./scripts/package-release.sh 0.1.0
